<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --border: rgba(11,11,11,0.10); --hairline: #e1e0d9;
    --accent: #eb6834; --good: #006300; --serious: #b25e00; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
      --muted: #898781; --border: rgba(255,255,255,0.10); --hairline: #2c2c2a;
      --accent: #d95926; --good: #0ca30c; --serious: #ec9b3e; --critical: #e66767;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1.45; color: var(--ink); background: var(--page);
    width: 340px;
  }
  #app { padding: 14px 14px 10px; display: grid; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .thumb {
    width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--hairline);
    background: #fff; object-fit: contain; flex: none;
  }
  .title { font-weight: 600; font-size: 13px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { font-size: 11.5px; color: var(--muted); }
  .price-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .price { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mrp { color: var(--muted); text-decoration: line-through; font-size: 12px; }
  .pill {
    display: inline-flex; padding: 1px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700;
  }
  .pill-off { background: rgba(0,99,0,0.12); color: var(--good); }
  .pill-target { background: rgba(235,104,52,0.12); color: var(--accent); }
  .status { font-size: 11.5px; color: var(--muted); }
  .status.ok { color: var(--good); }
  .status.blocked { color: var(--serious); }
  .status.error { color: var(--critical); }
  svg.spark { display: block; width: 100%; height: 44px; }
  button {
    font: inherit; width: 100%; display: inline-flex; align-items: center; justify-content: center;
    gap: 7px; padding: 8px 13px; border: 1px solid transparent; border-radius: 7px;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button.ghost { background: var(--surface); border-color: var(--border); color: var(--ink); font-weight: 500; }
  .msg { color: var(--ink-2); padding: 6px 0; }
  .result { font-size: 12px; min-height: 16px; }
  .result.ok { color: var(--good); }
  .result.err { color: var(--critical); }
  footer {
    display: flex; justify-content: space-between; padding: 8px 14px;
    border-top: 1px solid var(--hairline); font-size: 12px;
  }
  footer a { color: var(--ink-2); text-decoration: none; cursor: pointer; }
  footer a:hover { color: var(--ink); text-decoration: underline; }
</style>
</head>
<body>
<div id="app"><div class="msg">Loading…</div></div>
<footer>
  <a id="open-dash">Open dashboard</a>
  <a id="open-options">Settings</a>
</footer>
<script src="popup.js"></script>
</body>
</html>
