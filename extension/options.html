<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PriceWatch — Settings</title>
<style>
  /* Same dark-glass system as the dashboard. Extension pages can't pull remote
     webfonts under the default CSP, so this uses the closest system stacks. */
  :root {
    --page: #08090a; --surface: #0e1013; --ink: #ecedef; --ink-2: #c4c8ce;
    --muted: #8a9099; --dim: #6e737b; --border: rgba(255,255,255,0.09);
    --accent: #5ce0a8; --accent-ink: #05140d; --good: #5ce0a8; --critical: #f0837c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--page);
    display: grid; place-items: start center; min-height: 100vh; padding: 48px 16px;
    -webkit-font-smoothing: antialiased;
  }
  /* Matches the dashboard's ambient glow so the two surfaces read as one app. */
  body::before {
    content: ""; position: fixed; inset: -240px -10% auto -10%; height: 700px;
    pointer-events: none; z-index: 0;
    background:
      radial-gradient(60% 55% at 22% 0%, rgba(92,224,168,0.12), transparent 70%),
      radial-gradient(50% 50% at 82% 8%, rgba(138,168,255,0.09), transparent 70%);
  }
  .card {
    position: relative; z-index: 1;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018));
    border: 1px solid rgba(255,255,255,0.075); border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 30px 70px -40px rgba(0,0,0,0.9);
    padding: 26px; width: min(460px, 100%); display: grid; gap: 16px;
  }
  .head { display: flex; align-items: center; gap: 12px; }
  .head svg { width: 20px; height: 20px; color: var(--accent); }
  h1 { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; }
  .sub { font-size: 12px; color: var(--dim); }
  label {
    display: grid; gap: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim);
  }
  input, select {
    font: inherit; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px; letter-spacing: 0; text-transform: none;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px;
    background: rgba(255,255,255,0.03); color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-color: rgba(92,224,168,0.3); }
  input::placeholder { color: rgba(255,255,255,0.28); }
  select option { background: #101215; color: var(--ink); }
  label.check {
    display: flex; gap: 10px; align-items: flex-start;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 12.5px; letter-spacing: 0; text-transform: none; color: var(--ink-2);
  }
  label.check input { width: 14px; height: 14px; margin-top: 3px; accent-color: var(--accent); flex: none; padding: 0; }
  label.check .hint { display: block; margin-top: 3px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  button {
    font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 14px; border: 1px solid var(--border); border-radius: 9px;
    background: rgba(255,255,255,0.03); color: var(--ink-2); cursor: pointer;
    transition: background 0.14s ease, color 0.14s ease;
  }
  button:hover { background: rgba(255,255,255,0.07); color: var(--ink); }
  .primary {
    background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600;
    box-shadow: 0 6px 22px -8px rgba(92,224,168,0.4);
  }
  .primary:hover { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); }
  #status { font-family: var(--mono); font-size: 11px; min-height: 18px; color: var(--dim); }
  #status.ok { color: var(--accent); }
  #status.err { color: var(--critical); }
  .hint { font-size: 12px; color: var(--dim); line-height: 1.6; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>
      <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>
    </svg>
    <div>
      <h1>PriceWatch</h1>
      <p class="sub">Where should tracked products go?</p>
    </div>
  </div>

  <label>PriceWatch server URL
    <input id="server" type="url" placeholder="https://pricewatch.YOUR-SUBDOMAIN.workers.dev" autocomplete="off">
  </label>
  <label>API token
    <input id="token" type="password" placeholder="Value of the API_TOKEN Worker secret" autocomplete="off">
  </label>
  <p class="hint">After saving, just click the PriceWatch toolbar icon on any product page. Pin the icon for one-click access.</p>

  <label class="check">
    <input id="autosync" type="checkbox">
    <span>Auto-sync bot-walled products from this browser
      <span class="hint">Stores that refuse server checks (e.g. Myntra) are re-checked here on a timer,
      using your home IP and cookies. Works whenever the browser is running.</span></span>
  </label>
  <label class="check">
    <input id="passive" type="checkbox">
    <span>Passive capture while you browse
      <span class="hint">On stores you already track, visiting a tracked product's page records its
      current price automatically — no clicks. Never adds new products; runs only on tracked stores.</span></span>
  </label>
  <label>Auto-sync interval
    <select id="autosyncMins">
      <option value="120">Every 2 hours</option>
      <option value="240">Every 4 hours</option>
      <option value="480">Every 8 hours</option>
      <option value="1440">Once a day</option>
    </select>
  </label>

  <div class="row">
    <button id="test" type="button">Test connection</button>
    <button id="save" class="primary" type="button">Save</button>
  </div>
  <p id="status" role="status"></p>
</div>
<script src="options.js"></script>
</body>
</html>
