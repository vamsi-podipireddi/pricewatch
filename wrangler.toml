# PriceWatch — single Worker serves the site (static assets), the API, and the
# scheduled price sweep. Free tier only: Workers + D1 + cron triggers.

name = "pricewatch"
main = "src/worker.js"
compatibility_date = "2026-06-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pricewatch"
database_id = "4559b266-2e9f-4da6-94e4-038ea6cac503" # from: npx wrangler d1 create pricewatch

# Every 2 hours at :11. Each run checks the SWEEP_BATCH stalest products, so a
# product's effective cadence is 2h * ceil(count / batch).
[triggers]
crons = ["11 */2 * * *"]

[vars]
# Products checked per cron run. Kept small to stay inside the free-tier
# 10 ms CPU budget (regex over large HTML costs CPU).
SWEEP_BATCH = "6"
# Minimum 24h fall to raise a "drop" alert, in percent.
ALERT_DROP_PCT = "10"
# Secrets (npx wrangler secret put <NAME>), all optional:
#   API_TOKEN            protects writes
#   READ_TOKEN           set to also require a token on reads (public otherwise)
#   GMAIL_CLIENT_ID      \
#   GMAIL_CLIENT_SECRET   } email price alerts from your own Gmail account
#   GMAIL_REFRESH_TOKEN  /  (README -> "Price alerts" for the one-time setup)
#   ALERT_EMAIL_TO       inbox that receives the alerts

[observability]
enabled = true
